[build]
builder = "nixpacks"
watchPatterns = ["apps/web/**", "packages/ui/**"]
nixpacksConfigPath = "apps/web/nixpacks.toml"
buildCommand = "pnpm --filter @coship/web build"

[deploy]
startCommand = "npx serve apps/web/dist -s -l tcp://0.0.0.0:${PORT:-3000}"
healthcheckPath = "/"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
